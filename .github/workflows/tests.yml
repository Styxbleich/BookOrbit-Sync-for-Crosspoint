name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests (delivery, Plugin Hub contract)
        run: python3 -m unittest discover -s tests -v
      - name: Install test tools (JSZip, linkedom)
        run: npm ci
      - name: Settings page tests
        run: node --test tests/test_plugin_js.mjs
